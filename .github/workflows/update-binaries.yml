name: Update Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Julie version (e.g., 6.1.7)'
        required: true
      tag:
        description: 'Julie release tag (e.g., v6.1.7)'
        required: true
      plugin_source_sha:
        description: 'Reviewed julie-plugin commit SHA'
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      plugin_source_sha:
        required: true
        type: string
    secrets:
      publication_token:
        required: true
    outputs:
      published_sha:
        value: ${{ jobs.update.outputs.published_sha }}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.plugin_source_sha }}
          token: ${{ secrets.publication_token }}

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p /tmp/artifacts

          gh release download "${{ inputs.tag }}" \
            --repo anortham/julie \
            --pattern "julie-v${VERSION}-aarch64-apple-darwin.tar.gz" \
            --dir /tmp/artifacts

          gh release download "${{ inputs.tag }}" \
            --repo anortham/julie \
            --pattern "julie-v${VERSION}-x86_64-apple-darwin.tar.gz" \
            --dir /tmp/artifacts

          gh release download "${{ inputs.tag }}" \
            --repo anortham/julie \
            --pattern "julie-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --dir /tmp/artifacts

          gh release download "${{ inputs.tag }}" \
            --repo anortham/julie \
            --pattern "julie-v${VERSION}-x86_64-pc-windows-msvc.zip" \
            --dir /tmp/artifacts

      - name: Replace archives
        run: |
          VERSION="${{ inputs.version }}"

          # Remove old archives
          rm -f bin/archives/julie-v*

          # Move new archives in
          mv /tmp/artifacts/julie-v${VERSION}-aarch64-apple-darwin.tar.gz bin/archives/
          mv /tmp/artifacts/julie-v${VERSION}-x86_64-apple-darwin.tar.gz bin/archives/
          mv /tmp/artifacts/julie-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz bin/archives/
          mv /tmp/artifacts/julie-v${VERSION}-x86_64-pc-windows-msvc.zip bin/archives/

          # Remove any previously-extracted binaries so next launch re-extracts
          rm -rf bin/aarch64-apple-darwin bin/x86_64-apple-darwin bin/x86_64-unknown-linux-gnu bin/x86_64-pc-windows-msvc

      - name: Update skills from julie source
        run: |
          git clone --depth 1 --branch "${{ inputs.tag }}" \
            https://github.com/anortham/julie.git /tmp/julie

          rm -rf skills/
          mkdir -p skills

          # Keep in step with .claude/skills/ in the julie repo. The preceding
          # `rm -rf skills/` means a skill missing from this list is DELETED
          # from the plugin, not merely left stale.
          EXPECTED_SKILLS="dead-code-audit editing explore-area impact-analysis search-debug web-research"

          for skill in $EXPECTED_SKILLS; do
            if [ -d "/tmp/julie/.claude/skills/${skill}" ]; then
              cp -r "/tmp/julie/.claude/skills/${skill}" "skills/${skill}"
            else
              echo "ERROR: skill '${skill}' not found in julie repo" >&2
              exit 1
            fi
          done

          EXPECTED_COUNT=$(echo $EXPECTED_SKILLS | wc -w)
          SKILL_COUNT=$(ls skills/*/SKILL.md 2>/dev/null | wc -l)
          echo "Copied ${SKILL_COUNT} skills"
          if [ "$SKILL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "ERROR: expected ${EXPECTED_COUNT} skills, got ${SKILL_COUNT}" >&2
            exit 1
          fi

          # A skill added to julie but not to EXPECTED_SKILLS would ship missing.
          SOURCE_COUNT=$(ls -d /tmp/julie/.claude/skills/*/ 2>/dev/null | wc -l)
          if [ "$SOURCE_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "ERROR: julie has ${SOURCE_COUNT} skills but this workflow lists ${EXPECTED_COUNT}." >&2
            echo "Update EXPECTED_SKILLS above to match .claude/skills/ in the julie repo." >&2
            exit 1
          fi

          cp /tmp/julie/JULIE_AGENT_INSTRUCTIONS.md JULIE_AGENT_INSTRUCTIONS.md

      - name: Update version in manifests
        run: |
          VERSION="${{ inputs.version }}"

          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json
          mv tmp.json .claude-plugin/plugin.json

          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

          jq --arg v "$VERSION" '.plugins[0].version = $v' .claude-plugin/marketplace.json > tmp.json
          mv tmp.json .claude-plugin/marketplace.json

          jq --arg v "$VERSION" '.version = $v' plugin.json > tmp.json
          mv tmp.json plugin.json

          jq --arg v "$VERSION" '.version = $v' .codex-plugin/plugin.json > tmp.json
          mv tmp.json .codex-plugin/plugin.json

          jq --arg v "$VERSION" '.plugins[0].version = $v' .agents/plugins/marketplace.json > tmp.json
          mv tmp.json .agents/plugins/marketplace.json

          echo "Updated manifests to v${VERSION}"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.0

      - name: Validate generated plugin snapshot
        run: |
          VERSION="${{ inputs.version }}"
          node --test hooks/*.test.cjs
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const manifests = [
            ['package.json', value => value.version],
            ['plugin.json', value => value.version],
            ['.claude-plugin/plugin.json', value => value.version],
            ['.codex-plugin/plugin.json', value => value.version],
            ['.claude-plugin/marketplace.json', value => value.plugins[0].version],
            ['.agents/plugins/marketplace.json', value => value.plugins[0].version],
          ];
          for (const [path, getVersion] of manifests) {
            if (getVersion(JSON.parse(fs.readFileSync(path))) !== version) throw new Error(`version mismatch: ${path}`);
          }
          for (const path of ['mcp.json', 'mcp_codex.json', 'mcp_config.json', 'hooks/hooks.json', 'JULIE_AGENT_INSTRUCTIONS.md']) {
            if (!fs.statSync(path).size) throw new Error(`missing required plugin file: ${path}`);
          }
          NODE
          expected=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' \
            "julie-v${VERSION}-aarch64-apple-darwin.tar.gz" \
            "julie-v${VERSION}-x86_64-apple-darwin.tar.gz" \
            "julie-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "julie-v${VERSION}-x86_64-pc-windows-msvc.zip" | sort > "$expected"
          find bin/archives -maxdepth 1 -type f -name "julie-v${VERSION}-*" -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"
          find . -type l -print -quit | grep -q . && { echo "generated plugin contains a symlink" >&2; exit 1; } || true
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            test ! -e "bin/$target"
          done

      - name: Commit and force-push (orphan to prevent history bloat)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.publication_token }}
        run: |
          VERSION="${{ inputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan fresh-main
          git add -A
          git commit -m "feat: update to julie v${VERSION}"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push --force origin fresh-main:main
